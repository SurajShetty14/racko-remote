name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to the Ubuntu box
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Mode B (GStreamer/NVENC) needs the GStreamer dev packages on the box; see scripts/build-modeb-encode.sh.
      - name: Build broker
        run: cargo build -p broker --release --locked --features modeb-encode

      - name: Build ironrdp-web
        run: |
          set -euo pipefail
          wasm-pack build crates/ironrdp-web --target web --release
          pkg=crates/ironrdp-web/pkg/ironrdp_web.js
          if ! grep -q "import wasmUrl from './ironrdp_web_bg.wasm?url';" "$pkg"; then
            { printf "%s\n\n" "import wasmUrl from './ironrdp_web_bg.wasm?url';"; cat "$pkg"; } > "${pkg}.tmp"
            mv "${pkg}.tmp" "$pkg"
          fi
          sed -i "s|new URL('ironrdp_web_bg.wasm', import.meta.url)|wasmUrl|" "$pkg"

      - name: Build iron-remote-desktop
        working-directory: web-client/iron-remote-desktop
        run: |
          npm ci
          npm run build

      # Vite-only build. wasm-pack above is what fails the job if the WASM build fails.
      - name: Build iron-remote-desktop-rdp
        working-directory: web-client/iron-remote-desktop-rdp
        run: |
          npm ci
          npm run build-alone

      - name: Build racko-remote
        working-directory: web-client/racko-remote
        env:
          VITE_GATEWAY_URL: ${{ secrets.VITE_GATEWAY_URL }}
          VITE_BROKER_API_BASE: ${{ secrets.VITE_BROKER_API_BASE }}
          # Optional; unset derives wss://<domain>/modeb/webrtc from VITE_BROKER_API_BASE.
          VITE_MODEB_SIGNALING_URL: ${{ secrets.VITE_MODEB_SIGNALING_URL }}
        run: |
          set -euo pipefail
          test -n "$VITE_GATEWAY_URL"
          test -n "$VITE_BROKER_API_BASE"
          npm ci
          npm run build

      - name: Deploy to /opt/racko and /var/www/racko-remote
        run: bash scripts/deploy.sh
