[package]
name = "broker"
version = "0.1.0"
publish = false
description = "Minimal RDCleanPath WebSocket-to-RDP broker for the ironrdp-web POC"
edition.workspace = true
license.workspace = true

[lib]
name = "broker"
path = "src/lib.rs"
doctest = false
test = false

[[bin]]
name = "broker"
path = "src/main.rs"

[[bin]]
name = "modeb_probe"
path = "src/bin/modeb_probe.rs"

[[bin]]
name = "modeb_encode_probe"
path = "src/bin/modeb_encode_probe.rs"
required-features = ["modeb-encode"]

[[bin]]
name = "modeb_webrtc_probe"
path = "src/bin/modeb_webrtc_probe.rs"
required-features = ["modeb-encode"]

[features]
default = []
# Phase 2/3a: GStreamer NVENC/x264 encode to MP4 or WebRTC (needs system GStreamer + plugins on Linux).
modeb-encode = [
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-sdp",
    "dep:gstreamer-video",
    "dep:gstreamer-webrtc",
    "dep:ironrdp-input",
    "axum/ws",
]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dashmap = "6"
futures-util = "0.3"
gstreamer = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }
gstreamer-sdp = { version = "0.24", optional = true }
gstreamer-video = { version = "0.24", optional = true }
gstreamer-webrtc = { version = "0.24", optional = true, features = ["v1_18"] } # WebRTCDataChannel
image = { version = "0.25", default-features = false, features = ["png"] }
ironrdp-connector = { path = "../crates/ironrdp-connector" }
ironrdp-core = { path = "../crates/ironrdp-core", features = ["std"] }
ironrdp-graphics = { path = "../crates/ironrdp-graphics" }
ironrdp-input = { path = "../crates/ironrdp-input", optional = true }
ironrdp-pdu = { path = "../crates/ironrdp-pdu", features = ["std"] }
ironrdp-rdcleanpath = { path = "../crates/ironrdp-rdcleanpath" }
ironrdp-session = { path = "../crates/ironrdp-session" }
ironrdp-tls = { path = "../crates/ironrdp-tls", features = ["native-tls"] }
ironrdp-tokio = { path = "../crates/ironrdp-tokio", features = ["reqwest"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.26"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

# Application crate: do not inherit IronRDP's library-grade restriction lints
# (`workspace = true`). Clippy correctness/suspicious stay on via defaults;
# `-D warnings` still fails the build on real issues.
[lints.clippy]
as_conversions = "allow"
partial_pub_fields = "allow"
