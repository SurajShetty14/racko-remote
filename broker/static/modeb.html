<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Racko Mode B WebRTC test</title>
  <style>
    body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 monospace; }
    video { display: block; max-width: 100vw; max-height: 75vh; margin: 0 auto; background: #000; cursor: default; }
    video:focus { outline: 2px solid #4a8; }
    #log { height: 25vh; overflow-y: auto; margin: 0; padding: 6px 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline tabindex="0"></video>
  <pre id="log"></pre>
  <script>
    const video = document.getElementById('video');
    const logEl = document.getElementById('log');

    function log(...parts) {
      const line = `${new Date().toISOString().slice(11, 23)} ${parts.join(' ')}`;
      console.log(line);
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/webrtc`;
    const ws = new WebSocket(wsUrl);
    const send = (msg) => ws.send(JSON.stringify(msg));

    // Host candidates only: no STUN/TURN for the local test.
    const pc = new RTCPeerConnection({ iceServers: [] });

    // Input back-channel. The broker's webrtcbin creates the same pre-negotiated
    // channel (label "input", id 0) before its offer, so it is in the SDP; creating
    // it here before the answer binds this side to that SCTP stream.
    const input = pc.createDataChannel('input', { ordered: true, negotiated: true, id: 0 });
    input.onopen = () => log('input channel open (click the video to control the desktop)');
    input.onclose = () => log('input channel closed');
    input.onerror = (ev) => log('input channel error:', ev.error?.message ?? ev);
    const sendInput = (msg) => {
      if (input.readyState === 'open') input.send(JSON.stringify(msg));
    };

    pc.onsignalingstatechange = () => log('signaling state:', pc.signalingState);
    pc.onicegatheringstatechange = () => log('ICE gathering state:', pc.iceGatheringState);
    pc.oniceconnectionstatechange = () => log('ICE connection state:', pc.iceConnectionState);
    pc.onconnectionstatechange = () => log('peer connection state:', pc.connectionState);

    pc.onicecandidate = ({ candidate }) => {
      if (!candidate) {
        log('local ICE gathering complete');
        send({ type: 'ice', candidate: '', sdpMLineIndex: 0 });
        return;
      }
      log('local ICE candidate:', candidate.candidate);
      send({ type: 'ice', candidate: candidate.candidate, sdpMLineIndex: candidate.sdpMLineIndex ?? 0 });
    };

    pc.ontrack = ({ track, streams }) => {
      log('remote track:', track.kind, track.id);
      video.srcObject = streams[0] ?? new MediaStream([track]);
      video.play().catch((err) => log('video.play() failed:', err));
    };

    video.onloadedmetadata = () => log(`video playing ${video.videoWidth}x${video.videoHeight}`);

    ws.onopen = () => log('signaling connected:', wsUrl, '(broker is connecting to RDP; the offer follows)');
    ws.onclose = (ev) => log('signaling closed:', ev.code, ev.reason || '');
    ws.onerror = () => log('signaling error');

    ws.onmessage = async ({ data }) => {
      const msg = JSON.parse(data);
      try {
        if (msg.type === 'offer') {
          log('received SDP offer');
          await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          log('sending SDP answer');
          send({ type: 'answer', sdp: pc.localDescription.sdp });
        } else if (msg.type === 'ice') {
          log('remote ICE candidate:', msg.candidate);
          await pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex });
        } else {
          log('unexpected signaling message:', data);
        }
      } catch (err) {
        log('signaling handling failed:', err);
      }
    };

    // --- Input capture -------------------------------------------------------

    // Map a pointer event to desktop pixels (videoWidth x videoHeight is the RDP
    // desktop size), accounting for letterboxing from the default object-fit: contain.
    function desktopPoint(ev) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;
      const rect = video.getBoundingClientRect();
      const scale = Math.min(rect.width / vw, rect.height / vh);
      const left = rect.left + (rect.width - vw * scale) / 2;
      const top = rect.top + (rect.height - vh * scale) / 2;
      const clamp = (v, max) => Math.min(Math.max(Math.round(v), 0), max - 1);
      return { x: clamp((ev.clientX - left) / scale, vw), y: clamp((ev.clientY - top) / scale, vh) };
    }

    const BUTTONS = ['left', 'middle', 'right'];

    // Throttle mousemove to one message per animation frame (~60 fps).
    let pendingMove = null;
    let moveScheduled = false;
    video.addEventListener('mousemove', (ev) => {
      pendingMove = desktopPoint(ev);
      if (moveScheduled) return;
      moveScheduled = true;
      requestAnimationFrame(() => {
        moveScheduled = false;
        if (pendingMove) sendInput({ type: 'mousemove', ...pendingMove });
        pendingMove = null;
      });
    });

    for (const type of ['mousedown', 'mouseup']) {
      video.addEventListener(type, (ev) => {
        if (type === 'mousedown') video.focus();
        const button = BUTTONS[ev.button];
        const point = desktopPoint(ev);
        if (!button || !point) return;
        ev.preventDefault();
        pendingMove = null;
        sendInput({ type, button, ...point });
      });
    }

    video.addEventListener('contextmenu', (ev) => ev.preventDefault());

    video.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      sendInput({ type: 'wheel', deltaX: ev.deltaX, deltaY: ev.deltaY, deltaMode: ev.deltaMode });
    }, { passive: false });

    for (const type of ['keydown', 'keyup']) {
      video.addEventListener(type, (ev) => {
        ev.preventDefault();
        sendInput(type === 'keydown' ? { type, code: ev.code, repeat: ev.repeat } : { type, code: ev.code });
      });
    }

    window.addEventListener('beforeunload', () => { ws.close(); pc.close(); });
  </script>
</body>
</html>
